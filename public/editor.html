<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>arena editor</title>
<style>
  body { margin: 0; background: #12141a; color: #eee; font: 14px system-ui, sans-serif; }
  header { padding: 10px 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
           background: #1b1e26; border-bottom: 1px solid #2a2f3a; position: sticky; top: 0; z-index: 5; }
  header b { color: #ffd23f; }
  button { font: inherit; background: #2f3646; color: #eee; border: 1px solid #454f63;
           border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  button:hover { background: #3b4557; }
  #dl { background: #2f6b3a; border-color: #43904f; }
  #stage { position: relative; margin: 16px; width: fit-content; user-select: none; }
  #photo { display: block; max-width: calc(100vw - 32px); height: auto; }
  #layer { position: absolute; inset: 0; cursor: crosshair; }
  .box { position: absolute; border: 2px solid #ffd23f; background: rgba(255, 210, 63, .18);
         box-sizing: border-box; }
  .box .ui { position: absolute; top: -1px; left: -1px; display: flex; gap: 2px;
             background: #1b1e26cc; padding: 1px; border-radius: 0 0 4px 0; }
  .box input { width: 46px; font: 12px system-ui; background: #12141a; color: #ffd23f;
               border: 1px solid #454f63; border-radius: 3px; padding: 1px 3px; }
  .box .del { font: 12px system-ui; line-height: 1; padding: 2px 6px; background: #6b2f2f;
              border-color: #904343; }
  #hint { opacity: .65; }
</style>
</head>
<body>

<header>
  <b>arena editor</b>
  <span id="hint">drag on the photo to add cover &middot; the number is height in metres &middot; x deletes</span>
  <button id="dl">download arena.json</button>
  <span id="count"></span>
</header>

<div id="stage">
  <img id="photo" src="/room.jpg" draggable="false" alt="room" />
  <div id="layer"></div>
</div>

<script>
// The photo doubles as a rough floor plan: image x maps to world x, image y maps to world z,
// so the top of the photo is the far side of the room. Approximate is the point.
// WORLD must match ARENA * 2 in src/main.js.
const WORLD = 20;
const MIN = 0.012; // ignore stray clicks, as a fraction of the image

const layer = document.getElementById('layer');
const countEl = document.getElementById('count');
const boxes = []; // { el, nx, ny, nw, nh, height }  — all normalised 0..1 over the image

function refresh() {
  countEl.textContent = boxes.length + (boxes.length === 1 ? ' box' : ' boxes');
}

function addBox(nx, ny, nw, nh) {
  const el = document.createElement('div');
  el.className = 'box';
  el.style.cssText =
    `left:${nx * 100}%;top:${ny * 100}%;width:${nw * 100}%;height:${nh * 100}%`;

  const ui = document.createElement('div');
  ui.className = 'ui';
  const h = document.createElement('input');
  h.type = 'number'; h.value = '1.2'; h.step = '0.1'; h.min = '0.2'; h.title = 'height (m)';
  const del = document.createElement('button');
  del.className = 'del'; del.textContent = 'x'; del.title = 'delete';

  ui.append(h, del);
  el.append(ui);
  layer.append(el);

  const box = { el, nx, ny, nw, nh, get height() { return parseFloat(h.value) || 1.2; } };
  boxes.push(box);

  // Keep the controls from starting a new drag underneath them.
  ui.addEventListener('pointerdown', (e) => e.stopPropagation());
  del.addEventListener('click', () => {
    el.remove();
    boxes.splice(boxes.indexOf(box), 1);
    refresh();
  });
  refresh();
  return box;
}

// --- drag to create
let start = null, ghost = null;
const norm = (e) => {
  const r = layer.getBoundingClientRect();
  return {
    x: Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1),
    y: Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1)
  };
};

layer.addEventListener('pointerdown', (e) => {
  start = norm(e);
  ghost = document.createElement('div');
  ghost.className = 'box';
  layer.append(ghost);
  layer.setPointerCapture(e.pointerId);
});

layer.addEventListener('pointermove', (e) => {
  if (!start) return;
  const p = norm(e);
  const nx = Math.min(start.x, p.x), ny = Math.min(start.y, p.y);
  const nw = Math.abs(p.x - start.x), nh = Math.abs(p.y - start.y);
  ghost.style.cssText =
    `left:${nx * 100}%;top:${ny * 100}%;width:${nw * 100}%;height:${nh * 100}%`;
});

layer.addEventListener('pointerup', (e) => {
  if (!start) return;
  const p = norm(e);
  const nx = Math.min(start.x, p.x), ny = Math.min(start.y, p.y);
  const nw = Math.abs(p.x - start.x), nh = Math.abs(p.y - start.y);
  ghost.remove();
  ghost = null;
  start = null;
  if (nw > MIN && nh > MIN) addBox(nx, ny, nw, nh);
});

// --- export, in exactly the shape buildObstacles() reads
const r2 = (n) => Math.round(n * 100) / 100;

document.getElementById('dl').addEventListener('click', () => {
  const out = boxes.map((b) => ({
    x: r2((b.nx + b.nw / 2 - 0.5) * WORLD),
    z: r2((b.ny + b.nh / 2 - 0.5) * WORLD),
    w: r2(b.nw * WORLD),
    h: r2(b.height),
    d: r2(b.nh * WORLD)
  }));
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })
  );
  const a = document.createElement('a');
  a.href = url;
  a.download = 'arena.json';
  a.click();
  URL.revokeObjectURL(url);
  console.log('arena.json', out);
});

refresh();
</script>
</body>
</html>
